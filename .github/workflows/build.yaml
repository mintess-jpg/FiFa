name: Build FiFa APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o FiFa.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: gradle -p FiFa assembleRelease --no-daemon

      - name: Verify signature
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --verbose --print-certs FiFa/app/build/outputs/apk/release/*.apk
          $BT/aapt dump badging FiFa/app/build/outputs/apk/release/*.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: FiFa-apk
          path: FiFa/app/build/outputs/apk/release/*.apk
